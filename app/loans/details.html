<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <link rel="icon" type="image/svg+xml" href="/src/icons/mywallet.svg">
    <link rel="apple-touch-icon" href="/src/icons/mywallet.png">
    <link rel="manifest" href="/manifest.json">
    <title>Detalle del Préstamo - My Wallet</title>
    <!-- PWA: Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <!-- PWA: iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Wallet">
    <!-- Tailwind CSS v3 with Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="/styles/app.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style data-purpose="custom-scrollbar">
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #000000 !important;
        }

        /* Override app.css body min-height so our flex layout takes over */
        body {
            min-height: unset !important;
        }

        #appContainer {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
    </style>
    <style data-purpose="circular-progress">
        .progress-ring__circle {
            transition: stroke-dashoffset 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
    <style data-purpose="installment-animations">
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .installment-row {
            animation: fadeSlideUp 0.3s ease both;
        }

        /* Skeleton shimmer */
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #263349 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>

<body class="bg-black text-slate-100 font-sans antialiased min-h-screen">

    <!-- Overlay de carga -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Cargando préstamo...</div>
    </div>

    <div class="app-container" id="appContainer">
        <!-- BEGIN: MainContainer -->
        <!-- Outer column fills the whole viewport height -->
        <div class="max-w-[480px] mx-auto w-full h-full flex flex-col">

            <!-- ══ FIXED TOP BLOCK (never scrolls) ══ -->
            <div class="flex-shrink-0">
                <!-- BEGIN: Header -->
                <header class="bg-black/80 backdrop-blur-md px-6 py-4 flex items-center gap-4 border-b border-slate-800">
                    <button aria-label="Volver"
                        class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 transition-colors"
                        onclick="history.back()">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <h1 class="text-xs font-semibold uppercase tracking-wider text-slate-500">Detalle del Préstamo</h1>
                </header>
                <!-- END: Header -->

                <!-- BEGIN: SummaryCard -->
                <section class="px-6 pt-5 pb-4" data-purpose="loan-summary">
                    <div class="bg-slate-900 rounded-3xl p-6 border border-slate-800 shadow-xl">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <span class="text-sm text-slate-400">Total Pendiente</span>
                                <h2 class="text-3xl font-bold mt-1" id="montoPendiente">
                                    <span class="skeleton inline-block h-8 w-40">&nbsp;</span>
                                </h2>
                            </div>

                            <!-- Circular Progress Indicator -->
                            <div class="relative flex items-center justify-center">
                                <svg class="w-16 h-16" id="progressRingSvg">
                                    <!-- Track -->
                                    <circle class="text-slate-800" cx="32" cy="32" fill="transparent"
                                        r="24" stroke="currentColor" stroke-width="6"></circle>
                                    <!-- Fill -->
                                    <circle id="progressRingCircle"
                                        class="text-emerald-500 progress-ring__circle"
                                        cx="32" cy="32" fill="transparent" r="24"
                                        stroke="currentColor"
                                        stroke-dasharray="150.796"
                                        stroke-dashoffset="150.796"
                                        stroke-linecap="round" stroke-width="6">
                                    </circle>
                                </svg>
                                <span class="absolute text-[10px] font-bold" id="progressPct">0%</span>
                            </div>
                        </div>

                        <!-- Stats row -->
                        <div class="grid grid-cols-3 gap-4 pt-5 border-t border-slate-800">
                            <div class="text-center">
                                <p class="text-[10px] uppercase text-slate-500 font-bold mb-1">Tasa</p>
                                <p class="text-sm font-semibold" id="tasaInteres">—</p>
                            </div>
                            <div class="text-center border-x border-slate-800">
                                <p class="text-[10px] uppercase text-slate-500 font-bold mb-1">Plazo</p>
                                <p class="text-sm font-semibold" id="plazo">—</p>
                            </div>
                            <div class="text-center">
                                <p class="text-[10px] uppercase text-slate-500 font-bold mb-1">Cuota</p>
                                <p class="text-sm font-semibold" id="montoCuota">—</p>
                            </div>
                        </div>
                    </div>
                </section>
                <!-- END: SummaryCard -->

                <!-- Schedule title row (pinned above the scrollable list) -->
                <div class="flex items-center justify-between px-6 py-3 border-b border-slate-800/60">
                    <h3 class="font-bold text-base">Cronograma de Cuotas</h3>
                    <span class="text-xs text-slate-500" id="cuotasSummary">— de — pagadas</span>
                </div>
            </div>
            <!-- ══ END FIXED TOP BLOCK ══ -->

            <!-- ══ SCROLLABLE INSTALLMENTS LIST ══ -->
            <section
                class="flex-1 overflow-y-auto no-scrollbar px-6 pt-4 pb-28"
                data-purpose="installments-timeline">
                <div class="space-y-3" id="installmentsList">
                    <!-- Skeletons -->
                    <div class="skeleton h-16 w-full rounded-2xl"></div>
                    <div class="skeleton h-16 w-full rounded-2xl"></div>
                    <div class="skeleton h-16 w-full rounded-2xl"></div>
                </div>
            </section>
            <!-- ══ END SCROLLABLE LIST ══ -->

        </div>
        <!-- END: MainContainer -->
    </div>
    <!-- END: appContainer -->

    <!-- BEGIN: ActionFooter -->
    <footer class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto p-6 bg-gradient-to-t from-black via-black/90 to-transparent pointer-events-none">
        <button id="btnPagar"
            class="pointer-events-auto w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-4 rounded-2xl transition-all duration-200 shadow-lg shadow-emerald-500/20 active:scale-[0.98]">
            <i class="fa-solid fa-circle-check mr-2"></i>
            Pagar Cuota Actual
        </button>
    </footer>
    <!-- END: ActionFooter -->

    <script type="module">
        import { validarSesion } from "/js/auth.js";

        // ─────────────────────────────────────────────
        // Helpers
        // ─────────────────────────────────────────────

        const CIRCUMFERENCE = 2 * Math.PI * 24; // r=24 → 150.796

        function formatCurrency(val) {
            return '₡' + Number(val).toLocaleString('es-CR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatDate(isoStr) {
            // Parse without timezone shift: "2026-04-01" → split manually
            const [y, m, d] = isoStr.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            return date.toLocaleDateString('es-CR', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        /** Returns true if the given ISO date string is strictly before today (local) */
        function isOverdue(isoStr) {
            const [y, m, d] = isoStr.split('-').map(Number);
            const due = new Date(y, m - 1, d);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return due < today;
        }

        // ─────────────────────────────────────────────
        // Circular progress
        // ─────────────────────────────────────────────

        function setCircularProgress(pct) {
            const circle = document.getElementById('progressRingCircle');
            const label  = document.getElementById('progressPct');
            const offset = CIRCUMFERENCE - (pct / 100) * CIRCUMFERENCE;
            // Animate after a short delay so the transition fires
            requestAnimationFrame(() => {
                setTimeout(() => {
                    circle.style.strokeDashoffset = offset;
                    label.textContent = Math.round(pct) + '%';
                }, 200);
            });
        }

        // ─────────────────────────────────────────────
        // Build installment row HTML
        // ─────────────────────────────────────────────

        function buildInstallmentRow(cuota, index) {
            const { numero, monto, fechaVencimiento, estado } = cuota;
            const dateStr = formatDate(fechaVencimiento);
            const montoFmt = formatCurrency(monto);
            const delay = `animation-delay: ${index * 0.05}s`;
            const overdue = (estado === 1) && isOverdue(fechaVencimiento);

            if (estado === 2) {
                // ── PAGADA ──────────────────────────────────────────────
                return `
                <div class="installment-row flex items-center gap-4 bg-slate-900/50 p-4 rounded-2xl border border-slate-800/50" style="${delay}">
                    <div class="w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-500 shrink-0">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <div class="flex-grow min-w-0">
                        <p class="text-sm font-bold">Cuota #${numero}</p>
                        <p class="text-xs text-slate-500 truncate">Pagada el ${dateStr}</p>
                    </div>
                    <div class="text-right shrink-0">
                        <p class="text-sm font-bold text-emerald-400">${montoFmt}</p>
                        <span class="text-[10px] font-bold text-emerald-500 uppercase tracking-tighter">Completada</span>
                    </div>
                </div>`;
            }

            if (estado === 1) {
                // ── PENDIENTE (puede estar vencida) ─────────────────────
                if (overdue) {
                    // Atrasada → rojo
                    return `
                    <div class="installment-row flex items-center gap-4 bg-red-950/40 p-4 rounded-2xl border border-red-500/40 ring-1 ring-red-500/20" style="${delay}">
                        <div class="w-10 h-10 rounded-full bg-red-500/10 flex items-center justify-center text-red-400 shrink-0">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div class="flex-grow min-w-0">
                            <p class="text-sm font-bold text-red-300">Cuota #${numero}</p>
                            <p class="text-xs text-red-400/70 truncate">Venció el ${dateStr}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-sm font-bold text-red-300">${montoFmt}</p>
                            <span class="text-[10px] font-bold text-red-400 uppercase tracking-tighter">Atrasada</span>
                        </div>
                    </div>`;
                } else {
                    // Pendiente a tiempo → amarillo
                    return `
                    <div class="installment-row flex items-center gap-4 bg-slate-800 p-4 rounded-2xl border border-yellow-500/30 ring-1 ring-yellow-500/20" style="${delay}">
                        <div class="w-10 h-10 rounded-full bg-yellow-500/10 flex items-center justify-center text-yellow-400 shrink-0">
                            <i class="fa-solid fa-clock"></i>
                        </div>
                        <div class="flex-grow min-w-0">
                            <p class="text-sm font-bold">Cuota #${numero}</p>
                            <p class="text-xs text-slate-400 truncate">Vence el ${dateStr}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-sm font-bold text-white">${montoFmt}</p>
                            <span class="text-[10px] font-bold text-yellow-400 uppercase tracking-tighter">Pendiente</span>
                        </div>
                    </div>`;
                }
            }

            // ── PRÓXIMA (estado 0) ──────────────────────────────────────
            return `
            <div class="installment-row flex items-center gap-4 bg-slate-900/30 p-4 rounded-2xl border border-slate-800/30 opacity-60" style="${delay}">
                <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-600 shrink-0">
                    <i class="fa-regular fa-clock"></i>
                </div>
                <div class="flex-grow min-w-0">
                    <p class="text-sm font-bold text-slate-400">Cuota #${numero}</p>
                    <p class="text-xs text-slate-600 truncate">Vence el ${dateStr}</p>
                </div>
                <div class="text-right shrink-0">
                    <p class="text-sm font-bold text-slate-500">${montoFmt}</p>
                    <span class="text-[10px] font-bold text-slate-600 uppercase tracking-tighter">Próxima</span>
                </div>
            </div>`;
        }

        // ─────────────────────────────────────────────
        // Render loan data
        // ─────────────────────────────────────────────

        function renderLoan(loan) {
            const { nombre, montoPendiente, tasaInteres, plazoEnMeses, cuotas } = loan;

            // Header & summary
            // nombre removed from header per UX change
            document.getElementById('montoPendiente').textContent = formatCurrency(montoPendiente);
            document.getElementById('tasaInteres').textContent =
                tasaInteres > 0 ? (tasaInteres * 100).toFixed(3) + '%' : 'Sin interés';
            document.getElementById('plazo').textContent = plazoEnMeses + ' ' + (plazoEnMeses === 1 ? 'Mes' : 'Meses');

            // Cuota = monto de la primera cuota en estado 0 (pendiente próxima)
            // Si no hay estado 0, usar la primera en estado 1; si no, la primera cuota
            const cuotaPendiente =
                cuotas.find(c => c.estado === 0) ||
                cuotas.find(c => c.estado === 1) ||
                cuotas[0];
            document.getElementById('montoCuota').textContent =
                cuotaPendiente ? formatCurrency(cuotaPendiente.monto) : '—';

            // Progreso: cuotas pagadas (estado 2) / total * 100
            const total   = cuotas.length;
            const pagadas = cuotas.filter(c => c.estado === 2).length;
            const pct     = total > 0 ? (pagadas / total) * 100 : 0;

            document.getElementById('cuotasSummary').textContent = `${pagadas} de ${total} pagadas`;
            setCircularProgress(pct);

            // Cronograma
            const list = document.getElementById('installmentsList');
            const ordered = [...cuotas].sort((a, b) => a.numero - b.numero);
            list.innerHTML = ordered.map((c, i) => buildInstallmentRow(c, i)).join('');
        }

        // ─────────────────────────────────────────────
        // Load data
        // ─────────────────────────────────────────────

        async function cargarDetalle() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                document.getElementById('installmentsList').innerHTML = `
                    <p class="text-slate-500 text-center py-10">No se especificó un préstamo.</p>`;
                return;
            }

            try {
                const res = await fetch('/app/loans/data/loans.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const loans = await res.json();

                const loan = loans.find(l => String(l.id) === String(id));
                if (!loan) {
                    document.getElementById('installmentsList').innerHTML = `
                        <p class="text-slate-500 text-center py-10">Préstamo no encontrado.</p>`;
                    return;
                }

                renderLoan(loan);

            } catch (err) {
                console.error('Error al cargar préstamo:', err);
                document.getElementById('installmentsList').innerHTML = `
                    <div class="error-message mx-0">
                        <i class="fa-solid fa-triangle-exclamation mr-2"></i>
                        No se pudo cargar el préstamo.
                    </div>`;
            }
        }

        // ─────────────────────────────────────────────
        // Init
        // ─────────────────────────────────────────────

        validarSesion({
            onUserLogged: (user) => {
                console.log('Usuario logueado:', user);
            },
            onError: () => {
                window.location.href = '/app/login.html';
            }
        });

        window.addEventListener('load', async () => {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const appContainer   = document.getElementById('appContainer');

            await cargarDetalle();

            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
                appContainer.classList.add('loaded');
            }, 350);
        });
    </script>

</body>

</html>
