<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="/src/icons/mywallet.svg">
    <link rel="apple-touch-icon" href="/src/icons/mywallet.png">
    <link rel="manifest" href="/manifest.json">
    <title>Préstamos realizados - My Wallet</title>
    <!-- PWA: Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <!-- PWA: iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Wallet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Agrega el estilo de la aplicación -->
    <link rel="stylesheet" href="/styles/app.css">
    <!-- Agrega Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#000000',
                        'card-bg': '#1e293b',
                        'vibrant-green': '#22c55e',
                    }
                }
            }
        }
    </script>
    <style data-purpose="custom-scroll">
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Ajuste para que el fondo de Tailwind no entre en conflicto con el body de app.css */
        body {
            background-color: #000000 !important;
        }

        /* Animación de entrada para cada tarjeta */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loan-card {
            animation: slideUp 0.35s ease both;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .loan-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px -8px rgba(34, 197, 94, 0.18);
            border-color: rgba(34, 197, 94, 0.35) !important;
        }

        .loan-card:active {
            transform: scale(0.98);
        }

        /* Barra de progreso animada */
        .progress-bar-fill {
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Tag atrasado */
        .tag-late {
            background-color: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.25);
        }

        /* Tag al día */
        .tag-ok {
            background-color: rgba(34, 197, 94, 0.12);
            color: #22c55e;
            border-color: rgba(34, 197, 94, 0.25);
        }

        /* Tag pending (sin cuotas pagadas aún) */
        .tag-pending {
            background-color: rgba(148, 163, 184, 0.12);
            color: #94a3b8;
            border-color: rgba(148, 163, 184, 0.2);
        }

        /* Skeleton loader */
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #263349 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Estado vacío */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            gap: 16px;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>

<body>
    <!-- Overlay de carga -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Cargando préstamos...</div>
    </div>

    <div class="app-container w-full max-w-[480px] mx-auto min-h-screen flex flex-col relative pb-24" id="appContainer">
        <!-- BEGIN: Header -->
        <header class="sticky top-0 z-10 bg-black/80 backdrop-blur-md px-6 py-8" data-purpose="app-header">
            <div class="flex items-center gap-4">
                <button aria-label="Volver" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 transition-colors"
                    onclick="history.back()">
                    <i class="fa-solid fa-arrow-left w-6 h-6 flex items-center justify-center"></i>
                </button>
                <h1 class="text-2xl font-bold tracking-tight">Préstamos realizados</h1>
            </div>
        </header>
        <!-- END: Header -->

        <!-- BEGIN: LoanList -->
        <main class="flex-grow px-6 space-y-4 no-scrollbar overflow-y-auto" id="loanList">
            <!-- Skeletons mientras carga -->
            <div id="skeletonContainer" class="space-y-4">
                <div class="bg-card-bg p-5 rounded-2xl border border-slate-700/50 shadow-lg">
                    <div class="flex justify-between items-start mb-4">
                        <div class="space-y-2">
                            <div class="skeleton h-3 w-24"></div>
                            <div class="skeleton h-6 w-36 mt-1"></div>
                        </div>
                        <div class="skeleton h-6 w-16 rounded-full"></div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between">
                            <div class="skeleton h-3 w-28"></div>
                            <div class="skeleton h-3 w-20"></div>
                        </div>
                        <div class="skeleton h-2 w-full rounded-full"></div>
                    </div>
                </div>
                <div class="bg-card-bg p-5 rounded-2xl border border-slate-700/50 shadow-lg">
                    <div class="flex justify-between items-start mb-4">
                        <div class="space-y-2">
                            <div class="skeleton h-3 w-28"></div>
                            <div class="skeleton h-6 w-40 mt-1"></div>
                        </div>
                        <div class="skeleton h-6 w-16 rounded-full"></div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between">
                            <div class="skeleton h-3 w-28"></div>
                            <div class="skeleton h-3 w-24"></div>
                        </div>
                        <div class="skeleton h-2 w-full rounded-full"></div>
                    </div>
                </div>
            </div>
            <!-- Las tarjetas reales se insertan aquí -->
        </main>
        <!-- END: LoanList -->

        <!-- BEGIN: FixedActionButton -->
        <div class="fixed bottom-8 left-0 right-0 px-6 max-w-[480px] mx-auto" data-purpose="bottom-action">
            <button id="btnNuevoPrestamo"
                class="w-full bg-vibrant-green hover:bg-green-500 active:scale-95 transition-all duration-200 text-dark-bg font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-[0_10px_30px_-10px_rgba(34,197,94,0.5)]">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
                </svg>
                <span class="text-lg">Nuevo Préstamo</span>
            </button>
        </div>
        <!-- END: FixedActionButton -->
    </div>

    <script type="module">
        import { validarSesion } from "/js/auth.js";

        // ────────────────────────────────────────────────────────────
        // Helpers
        // ────────────────────────────────────────────────────────────

        /** Formatea un número como moneda costarricense ₡ */
        function formatCurrency(amount) {
            return '₡' + Number(amount).toLocaleString('es-CR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        /**
         * Determina si el préstamo está "Al día".
         * Lógica: la última cuota con estado 2 (pagada) no puede tener
         * una fecha de vencimiento mayor a hoy; si no hay cuotas pagadas
         * se retorna null (sin datos suficientes para decidir).
         *
         * En la práctica: si la cuota pendiente más próxima (estado 1 ó 0)
         * tenía que pagarse antes de hoy → atrasado. De lo contrario → al día.
         */
        function calcularEstado(cuotas) {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);

            // Ordenar cuotas por número
            const ordenadas = [...cuotas].sort((a, b) => a.numero - b.numero);

            // Buscar la primera cuota NO pagada (estado != 2) con fechaVencimiento pasada
            const vencidaSinPagar = ordenadas.find(c => c.estado !== 2 && new Date(c.fechaVencimiento) < hoy);

            if (vencidaSinPagar) return 'late';

            // Si todas están al corriente pero ninguna ha sido pagada aún
            const pagadas = ordenadas.filter(c => c.estado === 2);
            if (pagadas.length === 0) return 'pending';

            return 'ok';
        }

        /** Construye el HTML de una tarjeta de préstamo */
        function buildLoanCard(loan, index) {
            const totalCuotas = loan.cuotas.length;
            const cuotasPagadas = loan.cuotas.filter(c => c.estado === 2).length;
            const progresoPct = totalCuotas > 0 ? Math.round((cuotasPagadas / totalCuotas) * 100) : 0;
            const estado = calcularEstado(loan.cuotas);

            const tagClasses = {
                ok:      'tag-ok',
                late:    'tag-late',
                pending: 'tag-pending'
            };
            const tagLabels = {
                ok:      'Al día',
                late:    'Atrasado',
                pending: 'Pendiente'
            };
            const tagIcons = {
                ok:      'fa-circle-check',
                late:    'fa-circle-exclamation',
                pending: 'fa-clock'
            };

            const tagClass = tagClasses[estado];
            const tagLabel = tagLabels[estado];
            const tagIcon  = tagIcons[estado];

            // Barra de progreso: verde si ok, rojo si atrasado, gris si pendiente
            const barColor = estado === 'ok' ? 'bg-vibrant-green'
                           : estado === 'late' ? 'bg-red-500'
                           : 'bg-slate-500';

            return `
            <article
                id="loan-card-${loan.id}"
                class="loan-card bg-card-bg p-5 rounded-2xl border border-slate-700/50 shadow-lg"
                data-purpose="loan-card"
                data-loan-id="${loan.id}"
                style="animation-delay: ${index * 0.07}s"
                role="button"
                tabindex="0"
                aria-label="Ver detalles del préstamo de ${loan.nombre}"
            >
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-sm font-medium text-slate-400 uppercase tracking-wider">${loan.nombre}</h2>
                        <p class="text-xl font-bold mt-1">${formatCurrency(loan.montoPendiente)}</p>
                    </div>
                    <span class="px-3 py-1 text-xs font-bold rounded-full border flex items-center gap-1 ${tagClass}">
                        <i class="fa-solid ${tagIcon} text-[10px]"></i>
                        ${tagLabel}
                    </span>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Progreso del pago</span>
                        <span>${cuotasPagadas} de ${totalCuotas} cuotas</span>
                    </div>
                    <div class="w-full bg-slate-700 rounded-full h-2">
                        <div
                            class="progress-bar-fill ${barColor} h-2 rounded-full"
                            style="width: 0%"
                            data-target-width="${progresoPct}%"
                        ></div>
                    </div>
                </div>
            </article>`;
        }

        // ────────────────────────────────────────────────────────────
        // Carga de datos
        // ────────────────────────────────────────────────────────────

        async function cargarPrestamos() {
            const loanList = document.getElementById('loanList');
            const skeletonContainer = document.getElementById('skeletonContainer');

            try {
                const response = await fetch('/app/loans/data/loans.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const loans = await response.json();

                // Eliminar skeletons
                skeletonContainer.remove();

                if (!loans || loans.length === 0) {
                    loanList.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-hand-holding-dollar text-5xl text-slate-700"></i>
                            <p class="text-slate-400 font-medium">No hay préstamos registrados</p>
                            <p class="text-sm text-slate-600">Agrega un nuevo préstamo con el botón de abajo.</p>
                        </div>`;
                    return;
                }

                // Renderizar tarjetas
                const cardsHTML = loans.map((loan, i) => buildLoanCard(loan, i)).join('');
                loanList.insertAdjacentHTML('beforeend', cardsHTML);

                // Animar barras de progreso tras render
                requestAnimationFrame(() => {
                    document.querySelectorAll('.progress-bar-fill').forEach(bar => {
                        const target = bar.getAttribute('data-target-width');
                        setTimeout(() => { bar.style.width = target; }, 150);
                    });
                });

                // Eventos de clic para cada tarjeta
                document.querySelectorAll('[data-purpose="loan-card"]').forEach(card => {
                    const id = card.getAttribute('data-loan-id');
                    const navigate = () => { window.location.href = `details.html?id=${id}`; };
                    card.addEventListener('click', navigate);
                    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') navigate(); });
                });

            } catch (err) {
                console.error('Error al cargar préstamos:', err);
                skeletonContainer.remove();
                loanList.innerHTML = `
                    <div class="error-message mx-0">
                        <i class="fa-solid fa-triangle-exclamation mr-2"></i>
                        No se pudieron cargar los préstamos. Intenta de nuevo.
                    </div>`;
            }
        }

        // ────────────────────────────────────────────────────────────
        // Init
        // ────────────────────────────────────────────────────────────

        validarSesion({
            onUserLogged: (user) => {
                console.log('Usuario logueado:', user);
            },
            onError: () => {
                window.location.href = '/app/login.html';
            }
        });

        window.addEventListener('load', async () => {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const appContainer   = document.getElementById('appContainer');

            await cargarPrestamos();

            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
                appContainer.classList.add('loaded');
            }, 400);
        });

        // Botón nuevo préstamo
        document.getElementById('btnNuevoPrestamo').addEventListener('click', () => {
            window.location.href = 'add.html';
        });
    </script>
</body>

</html>
