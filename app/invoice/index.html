<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proforma InnoCR</title>
    <!-- Font Awesome 6 (gratuito) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <div class="app-wrapper">
        <!-- BARRA SUPERIOR -->
        <header class="app-header">
            <div class="header-left">
                <img src="img/logo.jpg" alt="InnoCR" class="logo-img" id="logoPreview" />
                <div class="company-info">
                    <h1>InnoCR</h1>
                    <p><i class="fas fa-map-pin"></i>100 metros norte del CECUDI, Monteverde, Puntarenas</p>
                    <div class="contact-info">
                        <span><i class="fas fa-phone"></i> 6219-6744</span>
                        <span><i class="fas fa-envelope"></i> bmendoza@innocr.com</span>
                        <span><i class="fas fa-globe"></i> https://innocr.com</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <span class="proforma-badge">
                    <i class="fas fa-file-invoice"></i> PROFORMA <strong id="proformaNum">2026081901</strong>
                </span>
            </div>
        </header>

        <!-- CUERPO PRINCIPAL -->
        <main class="proforma-container" id="proformaPaper">
            <!-- DATOS CLIENTE Y FECHA -->
            <section class="cliente-fecha">
                <div class="cliente-group">
                    <label><i class="fas fa-user"></i> Cliente</label>
                    <input type="text" id="clienteInput" value="Cliente Ejemplo" />
                    <div class="print-only print-value" id="clientePrint"></div>
                </div>
                <div class="fecha-group">
                    <label><i class="fas fa-calendar-day"></i> Fecha</label>
                    <input type="date" id="fechaInput" value="2026-07-13" />
                    <div class="print-only print-value" id="fechaPrint"></div>
                </div>
                <div class="moneda-group">
                    <label><i class="fas fa-coins"></i> Moneda</label>
                    <select id="monedaSelect">
                        <option value="CRC">₡ Colones (CRC)</option>
                        <option value="USD">$ Dólares (USD)</option>
                    </select>
                    <div class="print-only print-value" id="monedaPrint"></div>
                </div>
            </section>

            <!-- TABLA DE ITEMS -->
            <div class="table-responsive">
                <table class="items-table" id="itemsTable">
                    <thead>
                        <tr>
                            <th style="width:40%">Descripción</th>
                            <th style="width:15%">Cantidad</th>
                            <th style="width:20%">Precio unit.</th>
                            <th style="width:20%">Total</th>
                            <th style="width:5%"></th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody">
                        <!-- Filas generadas por JS -->
                    </tbody>
                </table>
            </div>

            <div class="print-only print-items-summary">
                <table class="print-items-table">
                    <thead>
                        <tr>
                            <th>Descripción</th>
                            <th>Cantidad</th>
                            <th>Precio unit.</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="printItemsBody"></tbody>
                </table>
            </div>

            <!-- BOTÓN AÑADIR LÍNEA -->
            <div class="add-row-btn">
                <button id="addRowBtn"><i class="fas fa-plus-circle"></i> Añadir línea</button>
            </div>

            <!-- DESCUENTO Y TOTALES -->
            <div class="totales-panel">
                <div class="totales-box">
                    <div class="total-line"><span>Subtotal</span> <span id="subtotalDisplay">₡0.00</span></div>
                    <div class="total-line descuento-line">
                        <span>Descuento (%)</span>
                        <input type="number" id="descuentoInput" value="0" min="0" max="100" step="0.5" />
                        <span class="print-only print-discount-text" id="descuentoPrint"></span>
                    </div>
                    <div class="total-line"><span>IVA (13%)</span> <span id="ivaDisplay">₡0.00</span></div>
                    <div class="total-line grand-total"><span>Total</span> <span id="totalDisplay">₡0.00</span></div>
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div class="action-buttons">
                <button class="btn-secondary" id="resetBtn"><i class="fas fa-undo-alt"></i> Reiniciar</button>
                <button class="btn-primary" id="printBtn"><i class="fas fa-print"></i> Imprimir</button>
            </div>
        </main>
    </div>

    <!-- CARGA DE ARCHIVOS JAVASCRIPT -->
    <script src="js/script.js"></script>
</body>

</html>
